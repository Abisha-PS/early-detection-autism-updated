# =============================================================================
# APPLICATION CONFIGURATION: Early Detection of Autism in Children
# Multimodal Behavioural Learning, Computer Vision, Voice Analysis and ADOS
# =============================================================================

server.port=8080
spring.application.name=Early-Detection-Autism-Screening

# -----------------------------------------------------------------------------
# DEFAULT PROFILE: H2 File-based Database (Works Out-Of-The-Box without MySQL setup)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/autism_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -----------------------------------------------------------------------------
# MYSQL PROFILE
# -----------------------------------------------------------------------------
# Activate with SPRING_PROFILES_ACTIVE=mysql. Configuration is in
# application-mysql.properties and reads DB_URL, DB_USERNAME, and DB_PASSWORD.

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# File Upload Settings for optional audio/clip capture
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

