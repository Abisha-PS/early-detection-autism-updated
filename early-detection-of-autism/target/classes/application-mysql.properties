# MySQL profile. Activate with SPRING_PROFILES_ACTIVE=mysql.
# Override these values with environment variables in each deployment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autism_screening_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# The H2 web console is not available under this profile.
spring.h2.console.enabled=false
